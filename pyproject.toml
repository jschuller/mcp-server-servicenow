[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-server-servicenow"
version = "0.9.3"
description = "ServiceNow MCP server for Claude Code, GitHub Copilot, Codex and any MCP client: Table API, CMDB, schema, aggregates and update sets, plus four Agent Skills. Read-only mode, OAuth client credentials for headless use, audit log."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Josh Schuller"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
keywords = [
    "servicenow",
    "servicenow-mcp",
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "servicenow-api",
    "table-api",
    "cmdb",
    "update-sets",
    "now-platform",
    "claude",
    "claude-code",
    "github-copilot",
    "codex",
    "opencode",
    "agent-skills",
    "fastmcp",
]
dependencies = [
    # 4.1.0 is the floor because that is what CI and the stdio smoke exercise
    # (4.1.0 also tightened skill-path containment, which the skills rely on);
    # fastmcp itself requires fastmcp-slim[client,server] at the matching
    # version, so no direct dependency on the slim package is needed.
    "fastmcp>=4.1.0,<5",
    "requests>=2.28.0",
    "anyio>=4.0",
    "pydantic>=2.12",
    "python-dotenv>=1.0.0",
    "httpx2>=2.5.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/jschuller/mcp-server-servicenow"
Source = "https://github.com/jschuller/mcp-server-servicenow"
Changelog = "https://github.com/jschuller/mcp-server-servicenow/blob/main/CHANGELOG.md"
Issues = "https://github.com/jschuller/mcp-server-servicenow/issues"
Security = "https://github.com/jschuller/mcp-server-servicenow/security/policy"

[project.scripts]
mcp-server-servicenow = "servicenow_mcp.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    # Upper-bounded for the same reason [tool.ruff.lint] pins its rule set:
    # CI installs the latest on every run, and a new mypy major could shift
    # defaults under previously-clean code.
    "mypy>=1.14,<3",
    "types-requests>=2.28.0",
    "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/servicenow_mcp"]

[tool.hatch.build.targets.sdist]
exclude = [
    "tests/",
    "docs/",
    ".github/",
    ".claude/",
    ".claude-plugin/",
    "dist/",
    "evals/",
    "examples/",
    "actions/",
    "*.png",
    "uv.lock",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Pin the rule set explicitly: CI installs the latest ruff, and ruff 0.16
# expanded its default selection (UP/I/RUF/BLE/...), which broke CI on code
# that was clean under earlier defaults. These are the classic defaults.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
# Practical strictness, not `strict = true`: every function is annotated and
# checked, but implicit `Any` from untyped third-party surfaces is tolerated.
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
