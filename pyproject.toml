[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-server-servicenow"
version = "0.5.1"
description = "MCP server for ServiceNow - 19 tools + 5 resources for table, CMDB, system, and update set operations"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Josh Schuller"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = [
    "servicenow",
    "mcp",
    "model-context-protocol",
    "claude",
    "cmdb",
    "itsm",
    "fastmcp",
    "oauth",
]
dependencies = [
    # Exact pin while 4.0 is in beta — revert to a range once 4.0 is stable.
    "fastmcp==4.0.0b2",
    # Redundant with fastmcp's own dependency, but required for `uvx
    # mcp-server-servicenow` to resolve: uv only honors pre-release
    # specifiers on direct dependencies, and fastmcp-slim sits at depth 2
    # behind the fastmcp meta-package. Remove when 4.0 is stable.
    "fastmcp-slim[client,server]==4.0.0b2",
    "requests>=2.28.0",
    "pydantic>=2.12",
    "python-dotenv>=1.0.0",
    "httpx2>=2.5.0",
]

[project.urls]
Homepage = "https://github.com/jschuller/mcp-server-servicenow"
Repository = "https://github.com/jschuller/mcp-server-servicenow"
Issues = "https://github.com/jschuller/mcp-server-servicenow/issues"

[project.scripts]
mcp-server-servicenow = "servicenow_mcp.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-mock>=3.0", "pytest-asyncio>=0.23.0", "ruff>=0.4.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/servicenow_mcp"]

[tool.hatch.build.targets.sdist]
exclude = [
    "tests/",
    "docs/",
    ".github/",
    ".claude/",
    ".claude-plugin/",
    "agents/",
    "commands/",
    "skills/",
    "dist/",
    "*.png",
    "uv.lock",
]

[tool.uv]
# fastmcp 4.0.0b2 pulls fastmcp-slim==4.0.0b2 transitively; uv only
# auto-allows pre-releases for direct dependencies. Remove when 4.0 is stable.
prerelease = "allow"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Pin the rule set explicitly: CI installs the latest ruff, and ruff 0.16
# expanded its default selection (UP/I/RUF/BLE/...), which broke CI on code
# that was clean under earlier defaults. These are the classic defaults.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
