<!--
  View fragment for the review_update_set tool: markup, its own few styles and
  its script. compose_view() wraps it into one self-contained document with
  base.css and bridge.js (McpApp) inlined ahead of it.

  Record text comes from the instance and is untrusted: it is written with
  McpApp.el (textContent) only, never as markup.
-->
<style>
  .head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .meta { color: var(--ink-2); margin: 2px 0 0; overflow-wrap: anywhere; }
  .desc {
    color: var(--ink-2); margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere;
    max-height: 4.4em; overflow: auto;
  }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 12px 0 8px; }
  .bar .chips { flex: 1 1 auto; }
  .bar input[type="search"] { min-width: 12em; flex: 0 1 16em; }
  /* The target takes the room that is left; its record name stays on one line
     and is cut with an ellipsis (the full name is the tooltip), so a narrow
     frame does not turn every row into three lines. */
  td.target { overflow-wrap: anywhere; width: 46%; max-width: 0; }
  td.target .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  td.when, td.who, td.type { white-space: nowrap; }
  td.when { font-variant-numeric: tabular-nums; color: var(--ink-2); }
</style>

<main id="app">
  <p class="note" id="status" role="status">Waiting for the update set…</p>

  <section id="review" hidden>
    <div class="head">
      <h1 id="name"></h1>
      <span class="badge" id="state"></span>
    </div>
    <p class="meta" id="meta"></p>
    <p class="desc" id="desc" hidden></p>

    <div class="bar">
      <div class="chips" id="chips" role="group" aria-label="Filter by change type"></div>
      <label class="sr-only" for="search">Search changes</label>
      <input type="search" id="search" placeholder="Search changes" title="Search target, name, type or author" autocomplete="off">
    </div>

    <div class="scroll">
      <table>
        <caption class="sr-only">Customer updates in this update set, newest first</caption>
        <thead>
          <tr>
            <th scope="col">Type</th>
            <th scope="col">Target</th>
            <th scope="col">Action</th>
            <th scope="col">Author</th>
            <th scope="col">Updated (UTC)</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <div class="foot">
      <span id="count" aria-live="polite"></span>
      <button type="button" id="refresh" hidden>Refresh</button>
    </div>
  </section>
</main>

<script>
(() => {
  "use strict";

  const { el, text } = McpApp;
  const $ = (id) => document.getElementById(id);
  const NO_TYPE = "(no type)";

  let app = null;
  const state = {
    data: null,
    type: null, // the selected type chip, or null for all
    search: "",
  };

  function showStatus(message, isError) {
    const status = $("status");
    status.textContent = message;
    status.classList.toggle("error", Boolean(isError));
    status.hidden = false;
  }

  function showResult(result) {
    const error = McpApp.errorText(result);
    if (error) return showStatus(error, true);
    const data = McpApp.data(result);
    if (!data || !Array.isArray(data.changes)) {
      return showStatus("The tool result has no changes to show.", true);
    }
    state.data = data;
    if (state.type && !data.changes.some((c) => (text(c.type) || NO_TYPE) === state.type)) state.type = null;
    render();
  }

  function render() {
    const data = state.data;
    const header = data.update_set || {};
    const changes = data.changes;

    $("status").hidden = true;
    $("review").hidden = false;
    $("name").textContent = text(header.name) || "Update set";
    $("state").textContent = text(header.state) || "unknown state";
    const scope = text(header["application.name"]);
    $("meta").textContent = [
      scope && "Scope: " + scope,
      text(header.sys_created_by) && "Created by " + text(header.sys_created_by),
      text(header.sys_updated_on) && "Updated " + text(header.sys_updated_on) + " UTC",
    ].filter(Boolean).join(" · ");
    const desc = $("desc");
    desc.textContent = text(header.description);
    desc.hidden = !desc.textContent;

    // Type chips, most common first; ties by name so the order is stable.
    const tally = new Map();
    for (const change of changes) {
      const type = text(change.type) || NO_TYPE;
      tally.set(type, (tally.get(type) || 0) + 1);
    }
    const types = [...tally.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
    const chips = $("chips");
    chips.replaceChildren();
    const addChip = (label, count, value) => {
      const chip = el("button", "chip", label);
      chip.type = "button";
      chip.setAttribute("aria-pressed", String(state.type === value));
      chip.append(el("span", "n", count));
      chip.addEventListener("click", () => { state.type = value; render(); });
      chips.append(chip);
    };
    addChip("All", changes.length, null);
    for (const [type, count] of types) addChip(type, count, type);

    const needle = state.search.trim().toLowerCase();
    const shown = changes.filter((change) => {
      if (state.type && (text(change.type) || NO_TYPE) !== state.type) return false;
      if (!needle) return true;
      return [change.target_name, change.name, change.sys_created_by, change.type]
        .some((field) => text(field).toLowerCase().includes(needle));
    });

    const rows = $("rows");
    rows.replaceChildren();
    for (const change of shown) {
      const row = el("tr");
      row.append(el("td", "type", text(change.type)));
      const target = el("td", "target", text(change.target_name));
      const recordName = el("span", "sub", text(change.name));
      recordName.title = text(change.name);
      target.append(recordName);
      row.append(target);
      const action = text(change.action);
      const actionCell = el("td", "action");
      actionCell.append(el("span", action === "DELETE" ? "badge danger" : "badge", action || "—"));
      row.append(actionCell);
      row.append(el("td", "who", text(change.sys_created_by)));
      row.append(el("td", "when", text(change.sys_updated_on)));
      rows.append(row);
    }
    if (!shown.length) {
      const row = el("tr");
      const cell = el("td", "note", changes.length ? "No change matches the filter." : "This update set has no changes.");
      cell.colSpan = 5;
      row.append(cell);
      rows.append(row);
    }

    const deletes = changes.filter((c) => text(c.action) === "DELETE").length;
    const limit = Number(data.limit) || 0;
    $("count").textContent = [
      "Showing " + shown.length + " of " + changes.length + (changes.length === 1 ? " change" : " changes"),
      deletes ? deletes + (deletes === 1 ? " delete" : " deletes") : "",
      limit && changes.length >= limit ? "the newest " + limit + " only: raise limit to see more" : "",
    ].filter(Boolean).join(" · ");
    $("refresh").hidden = !(app && app.canCallTools);
  }

  $("search").addEventListener("input", (event) => {
    state.search = event.target.value;
    if (state.data) render();
  });

  $("refresh").addEventListener("click", async () => {
    const button = $("refresh");
    button.disabled = true;
    button.textContent = "Refreshing…";
    try {
      // The host proxies this to the server: the same read-only tool, same arguments.
      showResult(await app.callTool());
    } catch (error) {
      showStatus("Refresh failed: " + error.message, true);
    } finally {
      button.disabled = false;
      button.textContent = "Refresh";
    }
  });

  McpApp.connect({
    name: "servicenow-update-set-review",
    version: "0.1.0",
    onResult: showResult,
    onCancelled: (reason) => showStatus("The tool call was cancelled" + (reason ? ": " + reason : "."), true),
  }).then((connected) => {
    app = connected;
    if (state.data) render();
  }).catch((error) => showStatus(error.message, true));
})();
</script>
