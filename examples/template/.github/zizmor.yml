# zizmor configuration (homelab-governance supply-chain baseline, 2026-10-18; keys checked against the zizmor 1.30.1 docs, docs/audits.md).
# Any ignore goes inline at the finding (`# zizmor: ignore[<audit>]`) with its reason, not here.
rules:
  unpinned-uses:
    config:
      policies:
        "*": hash-pin # every action, ours included, by full commit SHA
  dependabot-cooldown:
    config:
      days: 7 # the minimum default-days per ecosystem
