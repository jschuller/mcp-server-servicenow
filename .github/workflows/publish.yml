name: Publish to PyPI

on:
  release:
    types: [created]

# Supply-chain baseline (homelab-governance, 2026-10-20): the workflow grants nothing and the
# job asks for exactly what it needs; actions pinned by commit SHA; the checkout keeps no token;
# no cache is restored in a job that holds the publishing OIDC token.
permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # PyPI trusted publishing (OIDC); no other grant

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # A release created from the wrong commit (or a missed version bump)
      # would otherwise surface only as a confusing PyPI upload error — or
      # worse, publish clean with a stale version.
      - name: Verify tag matches package version
        run: |
          ver=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME}" != "v${ver}" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} != pyproject version v${ver} — was the release cut from the right commit?"
            exit 1
          fi

      - name: Install build tools
        run: pip install build==1.6.1

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
