name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Format check
        run: ruff format --check src/ tests/

      - name: Type check
        run: mypy src/

      - name: Unit tests
        run: python -m pytest tests/ -v --ignore=tests/integration

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The version lives in four places (pyproject, __init__, server.json x2);
      # a missed bump ships a release where PyPI and the MCP Registry disagree.
      - name: Check version consistency
        run: |
          python - << 'EOF'
          import json, re, sys, tomllib

          versions = {
              "pyproject.toml": tomllib.load(open("pyproject.toml", "rb"))["project"]["version"],
              "src/servicenow_mcp/__init__.py": re.search(
                  r'__version__ = "([^"]+)"',
                  open("src/servicenow_mcp/__init__.py").read(),
              ).group(1),
          }
          server_json = json.load(open("server.json"))
          versions["server.json"] = server_json["version"]
          versions["server.json packages[0]"] = server_json["packages"][0]["version"]

          if len(set(versions.values())) != 1:
              print(f"::error::Version mismatch: {versions}")
              sys.exit(1)
          print(f"All four version fields agree: {versions['pyproject.toml']}")
          EOF

      # The test job installs via pip, so nothing else exercises uv.lock —
      # a stale or hand-edited lockfile (or a broken dependency change like
      # PR #10's conflicting fastmcp pins) would land unnoticed.
      - name: Validate lockfile resolves and matches pyproject
        run: |
          pip install uv
          uv lock --check

      - name: Build and validate distribution
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*
