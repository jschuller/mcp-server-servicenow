name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Supply-chain baseline (homelab-governance, 2026-10-20): every action pinned to a full commit SHA with its tag as a
# comment, every tool by exact version (and sha256 where it is a download), checkouts keep no token. The workflow
# grants nothing; each job asks for exactly what it needs.
permissions: {}
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true } # a newer push supersedes a running check

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Format check
        run: ruff format --check src/ tests/

      - name: Type check
        run: mypy src/

      - name: Unit tests
        run: python -m pytest tests/ -v --ignore=tests/integration

  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the template's Action pin names an earlier commit
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The version lives in five places (pyproject, __init__, server.json x2,
      # .claude-plugin/plugin.json);
      # a missed bump ships a release where PyPI and the MCP Registry disagree.
      - name: Check version consistency
        run: |
          python - << 'EOF'
          import json, re, sys, tomllib

          versions = {
              "pyproject.toml": tomllib.load(open("pyproject.toml", "rb"))["project"]["version"],
              "src/servicenow_mcp/__init__.py": re.search(
                  r'__version__ = "([^"]+)"',
                  open("src/servicenow_mcp/__init__.py").read(),
              ).group(1),
          }
          server_json = json.load(open("server.json"))
          versions["server.json"] = server_json["version"]
          versions["server.json packages[0]"] = server_json["packages"][0]["version"]
          versions[".claude-plugin/plugin.json"] = json.load(
              open(".claude-plugin/plugin.json")
          )["version"]

          if len(set(versions.values())) != 1:
              print(f"::error::Version mismatch: {versions}")
              sys.exit(1)
          version = versions["pyproject.toml"]
          print(f"All five version fields agree: {version}")

          # The template pins the release it is copied from, in four places, and the
          # examples and this repo's own plugin pin it in their plugin manifests.
          template = "examples/template"
          pins = {
              f"{ex}/plugin.json": " ".join(json.load(open(f"examples/{ex}/.claude-plugin/plugin.json"))["mcpServers"]["servicenow"]["args"])
              for ex in ("change-impact", "incident-triage")
          }
          pins |= {
              # Anthropic's plugin directory blocks an unpinned uvx launcher.
              ".claude-plugin/plugin.json args": " ".join(json.load(open(".claude-plugin/plugin.json"))["mcpServers"]["servicenow"]["args"]),
              "plugin.json": " ".join(json.load(open(f"{template}/.claude-plugin/plugin.json"))["mcpServers"]["servicenow"]["args"]),
              "validate-skills.yml": open(f"{template}/.github/workflows/validate-skills.yml").read(),
              "evals.yml": open(f"{template}/.github/workflows/evals.yml").read(),
              "README.md": open(f"{template}/README.md").read(),
          }
          found = {
              name: set(re.findall(r"(?:==|@v|SERVER_VERSION: \"|server-version: \")(\d+\.\d+\.\d+)", text))
              for name, text in pins.items()
          }
          stale = {name: sorted(v - {version}) for name, v in found.items() if v - {version}}
          missing = sorted(name for name, v in found.items() if version not in v)
          if stale or missing:
              print(f"::error::Pins other than {version}: {stale}; no {version} pin in: {missing}")
              sys.exit(1)
          print(f"Template pins agree: {version}")

          # The template pins the Action to a full commit SHA, which must be in this
          # history and carry the same Action as this tree.
          import subprocess
          pin = re.search(r"actions/validate-skills@(\S+)", pins["validate-skills.yml"])
          sha = pin.group(1) if pin else ""
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              print(f"::error::The template's Action pin {sha!r} is not a full commit SHA")
              sys.exit(1)
          git = lambda *a: subprocess.run(["git", *a], capture_output=True).returncode
          if git("merge-base", "--is-ancestor", sha, "HEAD") or git(
              "diff", "--quiet", sha, "HEAD", "--", "actions/validate-skills"
          ):
              print(f"::error::The template's Action pin {sha} is not an earlier commit "
                    "with this tree's actions/validate-skills; pin one that is")
              sys.exit(1)
          print(f"Template Action pin {sha[:12]} carries this Action")
          EOF

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # uv by exact version, with the sha256 of
          # uv-x86_64-unknown-linux-gnu.tar.gz (the release digest, checked 2026-10-20),
          # since this Action's built-in list stops at 0.12.17. Bump both together.
          version: "0.12.24"
          checksum: "b4dfaef47d491a7296981f8374a4595f55dbf84e8937c8ecd2983574d8bb3da6"
          enable-cache: false

      # The test job installs via pip, so nothing else exercises uv.lock —
      # a stale or hand-edited lockfile (or a broken dependency change like
      # PR #10's conflicting fastmcp pins) would land unnoticed.
      - name: Validate lockfile resolves and matches pyproject
        run: uv lock --check

      - name: Build and validate distribution
        run: |
          pip install build==1.6.1 twine==7.0.0
          python -m build
          twine check --strict dist/*

      # The skills ship as package data; a packaging change that drops them
      # would still pass every unit test, since those read the source tree.
      - name: Check the wheel carries the skills
        run: |
          python - << 'EOF'
          import glob, sys, zipfile

          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          skills = [n for n in names if n.startswith("servicenow_mcp/skills/") and n.endswith("/SKILL.md")]
          refs = [n for n in names if "/skills/" in n and "/references/" in n]
          if len(skills) != 4 or len(refs) != 7:
              print(f"::error::Wheel has {len(skills)} SKILL.md and {len(refs)} reference files (want 4 and 7)")
              sys.exit(1)
          print(f"Wheel carries {len(skills)} skills and {len(refs)} reference files")
          EOF

  skills:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `./` on purpose: these steps test the Action as this commit changes it, from the checkout.
      - name: Validate the shipped skills and their citations (strict)
        uses: ./actions/validate-skills # zizmor: ignore[self-repository]
        with:
          path: src/servicenow_mcp/skills
          from-source: "true"
          strict: "true"
      - name: Validate this repository's plugin wrapper and its eval mocks (strict)
        uses: ./actions/validate-skills # zizmor: ignore[self-repository]
        with:
          path: .
          from-source: "true"
          strict: "true"
          citations: "false"
      - name: Validate the examples (strict)
        uses: ./actions/validate-skills # zizmor: ignore[self-repository]
        with:
          path: examples
          from-source: "true"
          strict: "true"

  zizmor:
    # Security audit of the workflows, the composite Action and the template's workflows
    # (config: .github/zizmor.yml). The Action runs zizmor's container image by version and
    # digest; results go to the log, not to code scanning.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: "1.30.1"
          advanced-security: false
