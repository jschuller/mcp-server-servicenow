name: Publish to MCP Registry

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The registry validates the version exists on PyPI. Both workflows
      # trigger on the same release event, and PyPI takes ~1-2 min to serve a
      # new version — without this wait the registry publish loses the race
      # every time (failed on v0.6.0 and v0.6.1 before this step existed).
      - name: Wait for PyPI to serve the released version
        run: |
          ver="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/mcp-server-servicenow/${ver}/json")
            if [ "$code" = "200" ]; then
              echo "PyPI serves ${ver} (waited ~$(( (i-1) * 15 ))s)"
              exit 0
            fi
            sleep 15
          done
          echo "::error::PyPI never served ${ver} after 10 min — check the 'Publish to PyPI' workflow first"
          exit 1

      # This binary runs in a job holding the OIDC token that authorizes
      # publishing to the io.github.jschuller/* namespace, so it is pinned and
      # checksum-verified rather than pulled from `releases/latest`. Bump the
      # version and the checksum together — the digest comes from that
      # release's registry_<version>_checksums.txt.
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: "1.8.1"
          MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
        run: |
          curl -sSLf -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
